# Compile l'APK de Fiido Explorer et le publie dans « Releases ».
# Se lance à chaque modification du dossier, ou à la main depuis l'onglet Actions.
name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Vérifier la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Les secrets KEYSTORE_B64 et KEYSTORE_PASSWORD ne sont pas configurés (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Installer Capacitor et les modules
        run: npm install --no-audit --no-fund

      - name: Préparer le projet Android
        env:
          OWNER: ${{ github.repository_owner }}
          BUILD: ${{ github.run_number }}
        run: |
          node scripts/prepare.js config
          npx cap add android
          node scripts/prepare.js android
          npx cap sync android

      - name: Compiler l'APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FiidoExplorer.apk"

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" FiidoExplorer.apk \
            --title "Fiido Explorer — build ${{ github.run_number }}" \
            --notes "APK compilé automatiquement. Sur le téléphone, touche FiidoExplorer.apk pour le télécharger puis l'installer." \
            --latest
