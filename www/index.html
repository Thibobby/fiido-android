<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E10">
<title>Fiido Explorer</title>
<style>
  html,body{margin:0;height:100%;background:#0B0E10;color:#9AA6B0;font:15px/1.4 system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<p>Chargement…</p>
<script>
// Chargeur de Fiido Explorer (application Android).
// L'interface est embarquée dans l'APK (app.html) : l'app s'ouvre même sans réseau.
// Quand une version plus récente est publiée dans le dossier GitHub « fiido », l'app la télécharge
// (voir checkUpdate dans la page) et la garde ici pour les démarrages suivants.
(function () {
  var REMOTE = 'https://raw.githubusercontent.com/__OWNER__/fiido/main/index.html';
  // Bibliothèques servies depuis l'APK plutôt que depuis internet
  var LIBS = [
    ['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css', 'lib/leaflet.css'],
    ['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js', 'lib/leaflet.js'],
    ['https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js', 'lib/chart.umd.js']
  ];
  function version(html) { var m = /APP_VERSION\s*=\s*'([^']+)'/.exec(html || ''); return m ? m[1] : ''; }
  function numbers(v) { return (v.match(/\d+/g) || []).map(Number); }
  function isNewer(a, b) {
    var x = numbers(a), y = numbers(b);
    for (var i = 0; i < Math.max(x.length, y.length); i++) { var d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0; }
    return false;
  }
  function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  window.FIIDO_LOADER = {
    remote: REMOTE,
    store: function (html, v) {
      try { localStorage.setItem('fiido_app_html', html); localStorage.setItem('fiido_app_ver', v); } catch (e) {}
    }
  };

  function boot(html) {
    var page = LIBS.reduce(function (acc, l) { return acc.split(l[0]).join(l[1]); }, html);
    document.open(); document.write(page); document.close();
  }

  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'app.html', true);
  xhr.onload = function () {
    var bundled = xhr.responseText, stored = read('fiido_app_html');
    // la version téléchargée l'emporte, sauf si l'APK embarque une version plus récente
    boot(stored && !isNewer(version(bundled), version(stored)) ? stored : bundled);
  };
  xhr.onerror = function () { var s = read('fiido_app_html'); if (s) boot(s); };
  xhr.send();
})();
</script>
</body>
</html>
